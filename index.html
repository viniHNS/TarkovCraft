<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarkov Craft</title>
  <meta name="description" content="Craft recipe generator for SPT modders">
  <link rel="icon" href="./assets/img/favicon-svg.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <div class="logo-mark">TC</div>
      <span class="app-title">Tarkov Craft</span>
    </div>
    <div class="header-right">
      <span class="version-label">v2.0</span>
      <button class="btn-clear" id="btn-clear-db">Clear DB</button>
    </div>
  </header>

  <!-- Body row -->
  <div id="body-row">

    <!-- Sidebar -->
    <nav id="sidebar">
      <button class="sidebar-btn active" data-section="craft" title="Craft Creator">
        <i class="fa-solid fa-hammer"></i>
        <span>Craft</span>
      </button>
      <button class="sidebar-btn wip" title="Coming soon">
        <i class="fa-solid fa-right-left"></i>
        <span>Barter</span>
      </button>
      <div class="sidebar-sep"></div>
      <button class="sidebar-btn sidebar-tools" id="btn-id-gen" title="Generate MongoDB ObjectId">
        <i class="fa-solid fa-gear"></i>
        <span>Tools</span>
      </button>
    </nav>

    <!-- Center panel -->
    <main id="center-panel">

      <!-- Crafts list (collapsible) -->
      <section id="crafts-list-section">
        <div class="section-header" id="crafts-list-toggle">
          <span class="section-title" id="crafts-list-title">Crafts — 0 items</span>
          <span class="section-toggle" id="crafts-list-chevron">▶</span>
        </div>
        <div id="crafts-list-body" class="collapsed">
          <!-- Craft rows injected here by craft.js -->
        </div>
      </section>

      <!-- Craft form -->
      <section id="craft-form-section">

        <!-- Craft name -->
        <div class="field-group">
          <div class="field-label"><span>Craft Name</span></div>
          <input type="text" id="craft-name" class="tc-input" placeholder="e.g. My Med Kit">
        </div>

        <!-- Ingredients -->
        <div class="field-group">
          <div class="field-label">
            <span>Craft Ingredients</span>
            <button class="field-label-action" id="btn-add-ingredient">+ Add Ingredient</button>
          </div>
          <div id="ingredient-rows">
            <!-- Ingredient rows injected by script.js -->
          </div>
        </div>

        <div class="form-divider"></div>

        <!-- Tools -->
        <div class="field-group">
          <div class="field-label">
            <span>Craft Tools</span>
            <button class="field-label-action" id="btn-add-tool">+ Add Tool</button>
          </div>
          <div id="tool-rows">
            <!-- Tool rows injected by script.js -->
          </div>
        </div>

        <div class="form-divider"></div>

        <!-- Misc -->
        <div class="field-group">
          <div class="field-label"><span>Misc</span></div>
          <div id="end-product-wrap" class="combobox-wrap" style="margin-bottom:6px;">
            <!-- End product combobox injected by script.js -->
          </div>
          <div class="misc-grid-2" style="margin-bottom:6px;">
            <input type="number" id="craft-time" class="tc-input-number" placeholder="Time (minutes)">
            <input type="number" id="craft-count" class="tc-input-number" placeholder="Output Count" value="1">
          </div>
          <div class="misc-grid-2">
            <select id="hideout-area" class="tc-select">
              <option value="">Hideout Area</option>
              <option value="2">LAVATORY</option>
              <option value="6">WATER COLLECTOR</option>
              <option value="7">MEDSTATION</option>
              <option value="8">NUTRITION UNIT</option>
              <option value="10">WORKBENCH</option>
              <option value="11">INTELLIGENCE CENTER</option>
              <option value="19">BOOZE GENERATOR</option>
            </select>
            <input type="number" id="hideout-level" class="tc-input-number" placeholder="Area Level" value="1">
          </div>
        </div>

        <button class="btn-add-craft" id="btn-add-craft">+ Add Craft</button>

      </section>
    </main>

    <!-- JSON preview panel -->
    <aside id="json-panel">
      <div id="json-panel-header">
        <span id="json-panel-label">crafts.json — 0 items</span>
      </div>
      <div id="json-body">
        <pre id="json-pre"></pre>
      </div>
      <div id="json-panel-footer">
        <button class="btn-json" id="btn-copy-json">
          <i class="fa-regular fa-copy"></i> Copy All
        </button>
        <button class="btn-json" id="btn-download-json">
          <i class="fa-solid fa-download"></i> Download .json
        </button>
      </div>
    </aside>

  </div><!-- /body-row -->
</div><!-- /app -->

<!-- Toast container -->
<div id="toast-container"></div>

<script src="https://kit.fontawesome.com/62c44247f4.js" crossorigin="anonymous"></script>
<script type="module" src="./assets/js/script.js"></script>
</body>
</html>
