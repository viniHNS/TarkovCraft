<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Left face -->
  <polygon points="8,19 32,32 32,57 8,44" fill="#8B5A22"/>
  <!-- Right face -->
  <polygon points="32,32 56,19 56,44 32,57" fill="#6B4018"/>
  <!-- Top face -->
  <polygon points="32,6 56,19 32,32 8,19" fill="#C8893F"/>

  <!-- Center grid cell (slightly darker) -->
  <polygon points="32,14.67 40,19 32,23.33 24,19" fill="#A06830"/>

  <!-- Top face grid lines -->
  <line x1="24" y1="10.33" x2="48" y2="23.33" stroke="#2A1000" stroke-width="1"/>
  <line x1="16" y1="14.67" x2="40" y2="27.67" stroke="#2A1000" stroke-width="1"/>
  <line x1="40" y1="10.33" x2="16" y2="23.33" stroke="#2A1000" stroke-width="1"/>
  <line x1="48" y1="14.67" x2="24" y2="27.67" stroke="#2A1000" stroke-width="1"/>

  <!-- Left face plank lines -->
  <line x1="8" y1="27.33" x2="32" y2="40.33" stroke="#6B4418" stroke-width="0.9"/>
  <line x1="8" y1="35.67" x2="32" y2="48.67" stroke="#6B4418" stroke-width="0.9"/>

  <!-- Right face plank lines -->
  <line x1="32" y1="40.33" x2="56" y2="27.33" stroke="#4A2C0E" stroke-width="0.9"/>
  <line x1="32" y1="48.67" x2="56" y2="35.67" stroke="#4A2C0E" stroke-width="0.9"/>

  <!-- Outlines -->
  <polygon points="32,6 56,19 32,32 8,19" fill="none" stroke="#1A0800" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="8,19 32,32 32,57 8,44" fill="none" stroke="#1A0800" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="32,32 56,19 56,44 32,57" fill="none" stroke="#1A0800" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
